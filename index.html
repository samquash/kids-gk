<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kids GK</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff7a45">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ff7a45;--card:#fff;--ink:#2b2b3a;--acc:#ff7a45;--acc2:#4aa3ff;--line:#ffe0b2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#c24e1f;--card:#2a2840;--ink:#f4f1ff;--acc:#ff9a6b;--acc2:#6bb6ff;--line:#3d3a5c}}
:root[data-theme="dark"]{--bg:#c24e1f;--card:#2a2840;--ink:#f4f1ff;--acc:#ff9a6b;--acc2:#6bb6ff;--line:#3d3a5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{margin:12px 12px 4px;font-size:22px;text-align:center;color:#fff3b0}
nav{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:15px;font-weight:600}
nav button.on{background:#fff3b0;border-color:#fff3b0;color:#b23e0f}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:8px 12px 24px}
.c{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer}
.c:active{transform:scale(.95);border-color:var(--acc)}
.e{font-size:42px;line-height:1.1}
.big{font-size:40px;font-weight:700;color:var(--acc2)}
.en{font-weight:700;font-size:15px}
.ur{font-size:22px;direction:rtl;font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:1.6}
.box{margin:8px 12px 24px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.opt{display:inline-block;margin:6px;border:2px solid var(--line);background:#fff3b0;color:#2b2b3a;border-radius:14px;padding:10px 22px;font-size:24px;font-weight:700}
#note{font-size:12px;text-align:center;color:#fff;opacity:.9;padding:0 12px 16px}
</style></head><body>
<h1>🌟 Kids GK 🌟</h1>
<nav id="nav"></nav>
<div id="grid"></div>
<div id="note">Awaaz ke liye phone ki volume on rakhein. Urdu voice phone ke settings mein Urdu text-to-speech par chalti hai.</div>
<script>
function sh(w,h,r,c){return '<span style="display:inline-block;width:'+w+'px;height:'+h+'px;border-radius:'+r+';background:'+c+';border:2px solid var(--line)"></span>'}
var D={
abc:"A Apple 🍎|B Ball ⚽|C Cat 🐱|D Dog 🐶|E Elephant 🐘|F Fish 🐟|G Grapes 🍇|H Horse 🐴|I Ice-cream 🍦|J Juice 🧃|K Kite 🪁|L Lion 🦁|M Moon 🌙|N Nest 🪺|O Orange 🍊|P Parrot 🦜|Q Queen 👑|R Rabbit 🐰|S Sun ☀️|T Tree 🌳|U Umbrella ☂️|V Van 🚐|W Watch ⌚|X Xylophone 🎶|Y Yo-yo 🪀|Z Zebra 🦓".split("|").map(function(s){var p=s.split(" ");return{big:p[0],en:p[0]+" for "+p[1],e:p[2],say:p[0]+" for "+p[1]}}),
urdu:[["ا","انار","🍎"],["ب","بکری","🐐"],["پ","پنکھا","🌀"],["ت","تتلی","🦋"],["ٹ","ٹوپی","🧢"],["ج","جہاز","✈️"],["چ","چڑیا","🐦"],["ح","حلوہ","🍮"],["خ","خرگوش","🐰"],["د","دروازہ","🚪"],["ر","روٹی","🫓"],["ز","زیبرا","🦓"],["س","سیب","🍏"],["ش","شیر","🦁"],["ط","طوطا","🦜"],["ع","عینک","👓"],["غ","غبارہ","🎈"],["ف","فیل","🐘"],["ق","قلم","🖊️"],["ک","کتاب","📖"],["گ","گھر","🏠"],["ل","لڈو","🍬"],["م","مور","🦚"],["ن","نل","🚰"],["و","وزن","⚖️"],["ہ","ہاتھی","🐘"],["ی","یاقوت","💎"]].map(function(a){return{big:a[0],ur:a[1],e:a[2],sayur:a[0]+"۔ "+a[1]}}),
fruits:"Apple|سیب|🍎,Banana|کیلا|🍌,Mango|آم|🥭,Orange|مالٹا|🍊,Grapes|انگور|🍇,Watermelon|تربوز|🍉,Strawberry|اسٹرابیری|🍓,Pomegranate|انار|🍎,Guava|امرود|🍐,Cherry|چیری|🍒,Pineapple|اناناس|🍍,Lemon|لیموں|🍋,Peach|آڑو|🍑,Coconut|ناریل|🥥".split(",").map(function(s){var p=s.split("|");return{en:p[0],ur:p[1],e:p[2]}}),
animals:"Lion|شیر|🦁,Elephant|ہاتھی|🐘,Cat|بلی|🐱,Dog|کتا|🐶,Horse|گھوڑا|🐴,Cow|گائے|🐄,Goat|بکری|🐐,Monkey|بندر|🐒,Rabbit|خرگوش|🐰,Camel|اونٹ|🐪,Parrot|طوطا|🦜,Peacock|مور|🦚,Fish|مچھلی|🐟,Sheep|بھیڑ|🐑,Bear|ریچھ|🐻,Zebra|زیبرا|🦓".split(",").map(function(s){var p=s.split("|");return{en:p[0],ur:p[1],e:p[2]}}),
nums:"One|ایک,Two|دو,Three|تین,Four|چار,Five|پانچ,Six|چھ,Seven|سات,Eight|آٹھ,Nine|نو,Ten|دس".split(",").map(function(s,i){var p=s.split("|");return{big:i+1,en:p[0],ur:p[1],n:i+1}}),
shapes:[["Circle","دائرہ",sh(56,56,"50%","#ff7a45")],["Square","چوکور",sh(56,56,"4px","#4aa3ff")],["Rectangle","مستطیل",sh(72,44,"4px","#4caf50")],["Triangle","تکون","🔺"]].map(function(a){return{en:a[0],ur:a[1],e:a[2]}}),
colors:[["Red","لال","#e53935"],["Blue","نیلا","#1e88e5"],["Green","ہرا","#43a047"],["Yellow","پیلا","#fdd835"],["Orange","نارنجی","#fb8c00"],["Purple","جامنی","#8e24aa"],["Pink","گلابی","#ec407a"],["Brown","بھورا","#795548"],["Black","کالا","#212121"],["White","سفید","#ffffff"],["Grey","سلیٹی","#9e9e9e"]].map(function(a){return{en:a[0],ur:a[1],e:sh(52,52,"50%",a[2])}})
};
var T=[["abc","ABC"],["urdu","اردو"],["nums","Math"],["fruits","Fruits"],["animals","Animals"],["shapes","Shapes"],["colors","Colors"],["quiz","Quiz"]];
var cur="abc",g=document.getElementById("grid"),nav=document.getElementById("nav");
function say(t,l){try{var u=new SpeechSynthesisUtterance(t);u.lang=l;u.rate=.85;u.onerror=function(e){document.getElementById("note").textContent="Voice masla: "+(e.error||"")+" ("+l+")"};var v=speechSynthesis.getVoices().filter(function(x){return x.lang.toLowerCase().replace("_","-").indexOf(l.slice(0,2))==0});if(v.length)u.voice=v[0];speechSynthesis.speak(u)}catch(e){}}
function both(en,ur){if(!window.speechSynthesis){document.getElementById("note").textContent="Is browser mein awaaz support nahi. Chrome mein kholein.";return}try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}setTimeout(function(){if(en)say(en,"en-US");if(ur)say(ur,"ur-PK")},200)}
function el(h,c){var d=document.createElement("div");d.className=c;d.innerHTML=h;return d}
function show(k){cur=k;Array.prototype.forEach.call(nav.children,function(b){b.className=b.dataset.k==k?"on":""});g.innerHTML="";g.style.display="grid";
 if(k=="nums"){g.style.display="block";nums();return}
 if(k=="quiz"){g.style.display="block";quiz();return}
 
 D[k].forEach(function(it){var h=(it.big?'<div class="big">'+it.big+'</div>':'')+'<div class="e">'+(it.e||"")+'</div>'+(it.en?'<div class="en">'+it.en+'</div>':'')+(it.ur?'<div class="ur">'+it.ur+'</div>':'');
  var c=el(h,"c");c.onclick=function(){if(k=="abc")both(it.say,null);else if(k=="urdu")both(null,it.sayur);else both(it.en,it.ur)};g.appendChild(c)})}
function nums(){var w=el('<div id="cnt"></div>',"");g.appendChild(w);var grid=el("","");grid.style.cssText="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;padding:8px 12px";
 var cb=el('<div class="e" id="dots">👆</div><div class="en" id="cen">Number dabayein</div><div class="ur" id="cur"></div>',"box");w.appendChild(cb);
 D.nums.forEach(function(it){var c=el('<div class="big">'+it.big+'</div><div class="en">'+it.en+'</div><div class="ur">'+it.ur+'</div>',"c");c.onclick=function(){document.getElementById("dots").textContent=new Array(it.n+1).join("⭐");document.getElementById("cen").textContent=it.en;document.getElementById("cur").textContent=it.ur;both(it.en,it.ur)};grid.appendChild(c)});w.appendChild(grid);
 var q=el("","box");w.appendChild(q);var sc=0;
 function nq(){var a=1+Math.floor(Math.random()*9),b=1+Math.floor(Math.random()*9),r=a+b,o=[r],x;while(o.length<3){x=Math.max(2,r+Math.floor(Math.random()*7)-3);if(o.indexOf(x)<0)o.push(x)}o.sort(function(){return Math.random()-.5});
  q.innerHTML='<div class="en">Quiz ⭐ '+sc+'</div><div class="big">'+a+' + '+b+' = ?</div>';o.forEach(function(v){var bt=document.createElement("button");bt.className="opt";bt.textContent=v;bt.onclick=function(){if(v==r){sc++;both("Well done!","شاباش!");nq()}else{both("Try again","پھر کوشش کریں")}};q.appendChild(bt)})}nq()}
function quiz(){var w=el('','box');g.appendChild(w);var sc=0,cats=['fruits','animals','shapes','colors'];
 function nq(){var p=D[cats[Math.floor(Math.random()*4)]],a=p[Math.floor(Math.random()*p.length)],o=[a],x;while(o.length<3){x=p[Math.floor(Math.random()*p.length)];if(o.indexOf(x)<0)o.push(x)}o.sort(function(){return Math.random()-.5});
  w.innerHTML='<div class="en">Quiz ⭐ '+sc+'</div><div class="e">'+a.e+'</div><div class="en">What is this?</div><div class="ur">یہ کیا ہے؟</div>';
  o.forEach(function(it){var b=document.createElement('button');b.className='opt';b.innerHTML=it.en+'<div class="ur">'+it.ur+'</div>';b.onclick=function(){if(it===a){sc++;both('Correct! '+a.en,'شاباش! '+a.ur);setTimeout(nq,1800)}else{both('Try again','پھر کوشش کریں')}};w.appendChild(b)})}nq()}
T.forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.dataset.k=t[0];b.onclick=function(){show(t[0])};nav.appendChild(b)});
document.addEventListener("contextmenu",function(e){e.preventDefault()});
try{speechSynthesis.getVoices()}catch(e){}
show("abc");
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
